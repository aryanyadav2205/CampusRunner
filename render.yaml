services:
  # FastAPI Backend Web Service
  - type: web
    name: campusrunner-api
    runtime: python
    buildCommand: cd backend && python -m pip install --upgrade pip && export CARGO_HOME=/tmp/cargo && pip install --only-binary=:all: -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./campus_runner.db
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mockkeyid
      - key: RAZORPAY_KEY_SECRET
        value: mocksecretkeyvalue

  # React + Vite Frontend Static Site
  - type: static
    name: campusrunner-web
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusrunner-api
          property: url
        transform: "{value}/api"
